plugins {
	id 'java-library'
	id 'maven-publish'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.github.internance'
version = '1.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
	withJavadocJar()
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'com.github.f4b6a3:uuid-creator:5.3.3'

	compileOnly 'jakarta.persistence:jakarta.persistence-api'
	compileOnly 'jakarta.servlet:jakarta.servlet-api'
	compileOnly 'org.springframework:spring-web'
	compileOnly 'org.springframework:spring-webmvc'
	compileOnly 'org.springframework:spring-context'
	compileOnly 'org.springframework.data:spring-data-jpa'
	compileOnly 'com.fasterxml.jackson.core:jackson-databind'
	compileOnly 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	compileOnly 'org.slf4j:slf4j-api'
	compileOnly 'io.micrometer:micrometer-tracing'
	compileOnly 'io.micrometer:micrometer-tracing-bridge-otel'
	compileOnly 'io.github.openfeign:feign-core:13.3'
	compileOnly 'org.springframework.kafka:spring-kafka'
	compileOnly 'org.apache.kafka:kafka-clients'
	compileOnly 'org.projectlombok:lombok'
	
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'jakarta.persistence:jakarta.persistence-api'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

bootJar {
    enabled = false
}
jar {
    enabled = true
    archiveClassifier = ''
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'common-lib'

            pom {
                name = 'common-lib'
                description = 'Internance common library: API/exception scaffolding, tracing, user context propagation, Feign error decoding, and pagination.'
                url = 'https://github.com/internance/common-lib'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
            }
        }
    }
}